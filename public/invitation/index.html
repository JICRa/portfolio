<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

    <title>Julia & José | Invitación</title>

    <meta
      name="description"
      content="Nos casamos 💙 Descubre nuestra invitación."
    />

    <!-- WhatsApp / Facebook / Open Graph -->
    <meta property="og:title" content="Julia & José 💍" />

    <meta
      property="og:description"
      content="Tenemos algo especial que compartir contigo 💙"
    />

    <meta
      property="og:image"
      content="https://josecontreras.ch/invitation-preview.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://josecontreras.ch/invitation-preview.png"
    />

    <meta property="og:image:type" content="image/png" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="Invitación de matrimonio de Julia y José"
    />

    <meta
      property="og:url"
      content="https://josecontreras.ch/invitation/"
    />

    <meta property="og:type" content="website" />

    <meta property="og:locale" content="es_CL" />

    <!-- Twitter / other preview systems -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Julia & José 💍"
    />

    <meta
      name="twitter:description"
      content="Tenemos algo especial que compartir contigo 💙"
    />

    <meta
      name="twitter:image"
      content="https://josecontreras.ch/invitation-preview.png"
    />

    <!--
      Human visitors are redirected into the React invitation.
      The /?/invitation syntax works with your existing
      GitHub Pages SPA redirect logic.
    -->
    <script>
      window.location.replace("/?/invitation");
    </script>
  </head>

  <body>
    <p>Cargando invitación...</p>
  </body>
